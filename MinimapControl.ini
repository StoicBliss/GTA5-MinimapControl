[Settings]
; Master toggle for Minimap Control mod
Enabled=true

; Hotkey to toggle minimap visibility (e.g. B, M, N, F10, None)
ToggleKey=B

; Optional hotkey modifier for keyboard (e.g. None, Shift, Control, Alt)
; If set to None, pressing Shift+B or Ctrl+B will not trigger the toggle
ToggleModifier=None

; Optional hotkey to toggle expanded/large minimap view (e.g. Z, LeftAlt, None)
ExpandKey=None

; Optional hotkey modifier for expanded minimap (e.g. None, Shift, Control, Alt)
ExpandModifier=None

[Controller]
; Enable gamepad / controller support
EnableController=true

; Controller control to toggle minimap (default: MultiplayerInfo = D-Pad Down)
; Options include: MultiplayerInfo (D-Pad Down), CharacterWheel, VehicleCinematicCam, Duck, etc.
ControllerToggleControl=MultiplayerInfo

; Hold duration in milliseconds required to toggle minimap via controller (default: 450ms)
; This allows a quick tap to preserve default game functions while a hold toggles the minimap
ControllerHoldTimeMs=450

[Modes]
; Dynamic vehicle-only mode: automatically hides minimap on foot and shows it when entering vehicles (default: true)
VehicleOnlyMode=true

[Display]
; Keep Health & Armor bars visible when minimap is hidden (default: true)
; When true, preserves the player's health and armor meters on screen while the radar/map is hidden
KeepHealthArmorVisible=true

; Show on-screen notification when toggling ("Minimap: ON" / "Minimap: OFF")
ShowNotification=true

; Use subtitle notification instead of ticker notification (default: false)
; If true, notifications display as clean on-screen subtitles and ticker notifications are disabled.
; If false, notifications display as tickers above the minimap and subtitles are disabled.
UseSubtitleNotification=false

; Duration to display notifications in seconds before auto-dismissing (default: 3)
NotificationDurationSeconds=3

; Play a subtle audio click when toggling
PlaySoundEffect=true
